<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>VOOK Paint Atelier</title>
    <meta
      name="description"
      content="A bilingual bicycle paint design studio. Explore solid and gradient colors, sample images, and export posters entirely in your browser."
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <div class="brand">VOOK<span>PAINT ATELIER</span></div>
      <nav aria-label="Tools">
        <button id="saveDesign" type="button">保存配色</button>
        <button id="restoreDesign" type="button">恢复配色</button>
        <button id="language" type="button">English</button>
      </nav>
    </header>
    <main>
      <section class="stage">
        <div class="intro">
          <div class="eyebrow" id="modelEyebrow">VOOK V9</div>
          <h1>色彩系统</h1>
        </div>
        <div id="bikeWrap">
          <span id="loading">载入车型…</span
          ><canvas
            id="bike"
            aria-label="VOOK涂装设计预览"
            style="display: none"
          ></canvas>
        </div>
        <div class="modelCaption" id="modelCaption">V9 · AERO CARBON</div>
      </section>
      <aside class="panel">
        <div class="panelScroll">
          <div class="section modelSection">
            <h2 class="stepHeading">
              <span class="stepNumber">01</span
              ><label for="model">选择车型</label>
            </h2>
            <select id="model" aria-label="选择车型">
              <option value="v9" selected>VOOK V9 · 气动公路</option>
              <option value="v8">VOOK V8 · 碳轮版</option>
              <option value="carbon">VOOK ONE 3.0 · 碳轮版</option>
              <option value="crv">VOOK CRV · 城市平把</option>
            </select>
          </div>
          <div class="section paintSection">
            <h2 class="stepHeading">
              <span class="stepNumber">02</span><span>设计配色</span>
            </h2>
            <p class="stepHint">
              先套用灵感方案，再选部位，用调色盘或图片吸色微调。
            </p>
            <div class="label">颜色微调</div>
            <div
              class="seg paintModes"
              role="group"
              aria-label="车架与前叉涂装方式"
            >
              <button id="mode-solid" class="active" aria-pressed="true">
                纯色</button
              ><button id="mode-gradient" aria-pressed="false">渐变</button>
            </div>
            <div class="rows" id="rows"></div>
            <p class="toolHint">先点选部位，再点色圈调色，也可直接输入色号。</p>
          </div>
          <div class="reference">
            <div class="label">图片吸色</div>
            <p class="toolHint">
              为当前选中的部位取色。点击图片立即应用，悬停可放大查看。
            </p>
            <div
              class="drop"
              id="drop"
              tabindex="0"
              aria-label="上传、拖入或粘贴图片"
            >
              <button id="upload">添加图片</button
              ><button id="expandReference" type="button" hidden>
                放大取色 ↗</button
              ><input id="file" type="file" accept="image/*" hidden />
              <p id="refHint">拖入图片，或 ⌘V / Ctrl+V 粘贴</p>
              <div id="refWrap">
                <canvas id="ref" aria-label="点击参考图片吸色"></canvas>
              </div>
            </div>
            <div id="loupe" aria-hidden="true">
              <canvas id="loupeCanvas" width="132" height="132"></canvas
              ><span id="loupeHex"></span>
            </div>
            <div id="sample">
              <span id="chip"></span><span id="sampleHex"></span
              ><button id="apply">应用颜色</button>
            </div>
            <div class="status" id="status" role="status">
              选择部位，点击参考图片吸色
            </div>
          </div>
          <div class="section inspirationSection">
            <div class="inspirationHeading">
              <span class="label">灵感配色</span
              ><span id="inspirationCount">纯色 · 20</span>
            </div>
            <p class="toolHint">
              一键应用整套配色，之后仍可用调色盘或图片吸色微调。
            </p>
            <div id="inspirationList" class="inspirationList"></div>
            <button
              id="inspirationToggle"
              type="button"
              aria-expanded="false"
              aria-controls="inspirationList"
            >
              展开全部 ↓</button
            ><a
              id="brandSource"
              target="_blank"
              rel="noopener noreferrer"
              style="display: none"
            ></a>
          </div>
        </div>
        <div class="actions"><button id="export">导出设计 ↗</button></div>
      </aside>
    </main>
    <dialog id="referenceDialog" aria-label="放大图片取色">
      <div class="referenceDialogBar">
        <span>图片取色 · 点击图片应用颜色</span
        ><button id="closeReference" type="button">完成</button>
      </div>
      <div id="referenceDialogImage"></div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
